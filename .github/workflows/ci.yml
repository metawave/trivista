# bin/ci on every pull request and push to main; on main, the arm64 image is pushed and scanned (security.yml)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432
      OIDC_LOGIN_GROUP: trivista_users
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564 # v1.341.0
        with:
          bundler-cache: true
      - run: bin/ci

  image:
    needs: test
    if: github.ref == 'refs/heads/main'
    # The server is arm64: build natively instead of emulating
    runs-on: ubuntu-24.04-arm
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # Flux's ImagePolicy picks the newest main-<timestamp>-<sha8>
      - id: tag
        run: echo "tag=main-$(date +%s)-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: registry.metawave.ch
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: |
            registry.metawave.ch/metawave/trivista:${{ steps.tag.outputs.tag }}
            registry.metawave.ch/metawave/trivista:latest
          # GitHub's cache instead of a :cache tag in the registry
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    needs: image
    uses: ./.github/workflows/security.yml
    with:
      tag: ${{ needs.image.outputs.tag }}
    secrets: inherit
