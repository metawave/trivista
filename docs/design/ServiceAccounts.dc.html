<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Service accounts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2b55c9;text-decoration:none}a:hover{color:#1f429f;text-decoration:underline}
</style>
</helmet>
<div style="width: 100%; min-height: 700px; background: #f6f7f9; color: #15181d; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; line-height: 1.45">

<header style="background: #15181d; color: #ffffff">
<div style="max-width: 1360px; margin: 0 auto; padding: 0 24px; min-height: 52px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 28px">
<a href="Projects.dc.html" style="display: flex; align-items: center; gap: 10px; color: #ffffff; font-weight: 600; font-size: 16px; text-decoration: none"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="6" fill="#2a2f37"></rect><rect x="6" y="7" width="16" height="3" rx="1" fill="#d0362c"></rect><rect x="6" y="12.5" width="12" height="3" rx="1" fill="#e8821e"></rect><rect x="6" y="18" width="7" height="3" rx="1" fill="#f0c94a"></rect></svg>Trivista</a>
<nav aria-label="Main" style="display: flex; gap: 4px; font-size: 14px">
<a href="Projects.dc.html" style="padding: 6px 10px; border-radius: 6px; color: #c3c9d1; text-decoration: none">Projects</a>
<a href="ServiceAccounts.dc.html" aria-current="page" style="padding: 6px 10px; border-radius: 6px; background: #2a2f37; color: #ffffff; text-decoration: none">Service accounts</a>
</nav>
</div>
<div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: #c3c9d1">
<span>[USER NAME]</span>
<button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #4a525e; border-radius: 6px; background: transparent; color: #ffffff; font: 500 13px 'IBM Plex Sans', sans-serif; cursor: pointer">Sign out</button>
</div>
</div>
</header>

<main style="max-width: 1040px; margin: 0 auto; padding: 32px 24px 64px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 32px; line-height: 40px; font-weight: 600; letter-spacing: -0.01em">Service accounts</h1>
<span style="font-size: 13px; color: #4a525e">Identities for CI pipelines. Their Upload Tokens can only upload scans.</span>
</div>
<a href="ServiceAccountNew.dc.html" style="height: 36px; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; border: 1px solid #2b55c9; border-radius: 6px; background: #2b55c9; color: #ffffff; font-weight: 500; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>New service account</a>
</div>

<div style="background: #ffffff; border: 1px solid #d9dde3; border-radius: 6px; overflow-x: auto">
<table style="width: 100%; min-width: 560px; border-collapse: collapse; font-size: 13px">
<thead>
<tr style="background: #f0f2f5; text-align: left; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #4a525e">
<th style="padding: 8px 20px; font-weight: 600; border-bottom: 1px solid #d9dde3">Name</th>
<th style="padding: 8px 20px 8px 12px; font-weight: 600; border-bottom: 1px solid #d9dde3">Owner</th>
</tr>
</thead>
<tbody>
<sc-for list="{{accounts}}" as="a" hint-placeholder-count="5">
<tr style="height: 48px">
<td style="padding: 0 20px; border-bottom: 1px solid #e6e9ed"><a href="ServiceAccount.dc.html" style="font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 14px">{{a.name}}</a></td>
<td style="padding: 0 20px 0 12px; border-bottom: 1px solid #e6e9ed; color: #4a525e">
<span style="display: inline-flex; align-items: center; gap: 6px">
<sc-if value="{{a.group}}" hint-placeholder-val="{{true}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-label="Group"><circle cx="9" cy="8" r="3.5"></circle><circle cx="17" cy="9" r="2.5"></circle><path d="M2.5 20c.8-3.5 3.3-5.5 6.5-5.5s5.7 2 6.5 5.5"></path><path d="M16 14.5c2.6 0 4.6 1.6 5.3 4.5"></path></svg></sc-if>
<sc-if value="{{a.user}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-label="User"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg></sc-if>
{{a.owner}}
</span>
</td>
</tr>
</sc-for>
</tbody>
</table>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    const sa = (name, owner, group) => ({ name, owner, group, user: !group });
    return {
      accounts: [
        sa('ci-platform-api', 'team-platform', true),
        sa('ci-billing', 'team-billing', true),
        sa('k8s-prod-eu-1', 'team-sre', true),
        sa('k8s-staging-eu-1', 'team-sre', true),
        sa('docs-site', '[USER NAME]', false)
      ]
    };
  }
}
</script>
</body>
</html>
