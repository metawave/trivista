<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 28px">
<a href="Projects.dc.html" style="display: flex; align-items: center; gap: 10px; color: #ffffff; font-weight: 600; font-size: 16px; text-decoration: none"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="6" fill="#2a2f37"></rect><rect x="6" y="7" width="16" height="3" rx="1" fill="#d0362c"></rect><rect x="6" y="12.5" width="12" height="3" rx="1" fill="#e8821e"></rect><rect x="6" y="18" width="7" height="3" rx="1" fill="#f0c94a"></rect></svg>Trivista</a>
<nav aria-label="Main" style="display: flex; gap: 4px; font-size: 14px">
<a href="Projects.dc.html" style="padding: 6px 10px; border-radius: 6px; color: #c3c9d1; text-decoration: none">Projects</a>

<div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: #c3c9d1">

</nav>
<h1 style="margin: 0; font-size: 32px; line-height: 40px; font-weight: 600; letter-spacing: -0.01em">New service account</h1>

<form style="background: #ffffff; border: 1px solid #d9dde3; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 20px">
<p role="alert" style="margin: 0; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 6px; border: 1px solid #f0c4c0; background: #fbeceb; color: #8a1f19; font-size: 13px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5"></path><path d="M12 16.5v.5"></path></svg>Name has already been taken</p>
<div style="display: flex; flex-direction: column; gap: 4px">
<label for="sa-name" style="font-size: 13px; font-weight: 600">Name</label>
<input id="sa-name" required value="ci-platform-api" aria-invalid="true" style="height: 36px; box-sizing: border-box; padding: 0 10px; border: 1px solid #b42a22; border-radius: 6px; font: 400 14px 'IBM Plex Mono', monospace; color: #15181d">
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<label for="sa-owner" style="font-size: 13px; font-weight: 600">Owner</label>
<select id="sa-owner" style="height: 36px; padding: 0 10px; border: 1px solid #c3c9d1; border-radius: 6px; background: #ffffff; color: #15181d; font: 400 14px 'IBM Plex Sans', sans-serif"><option>team-platform</option><option>Me</option><option>team-sre</option></select>
<span style="font-size: 12px; color: #68717d">A group owner lets every group member manage its tokens.</span>
</div>
<div style="display: flex; gap: 12px; padding-top: 4px">
<button type="submit" style="height: 36px; padding: 0 14px; border: 1px solid #2b55c9; border-radius: 6px; background: #2b55c9; color: #ffffff; font: 500 14px 'IBM Plex Sans', sans-serif; cursor: pointer">Create</button>
<a href="ServiceAccounts.dc.html" style="height: 36px; display: inline-flex; align-items: center; padding: 0 10px; font-weight: 500">Cancel</a>
</div>
</form>
</main>
</div>
