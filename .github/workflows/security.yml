# Trivy scans of the checkout and the image, uploaded to Trivista itself: nightly against latest, and against every
# new image from ci.yml
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-26.04-arm
    env:
      IMAGE: ghcr.io/metawave/trivista:${{ inputs.tag || 'latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan source
        uses: docker://aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
        with:
          args: >-
            fs --quiet --format json --scanners vuln,misconfig,secret,license --list-all-pkgs=false
            --output trivy-source.json .
      - name: Scan image
        uses: docker://aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
        with:
          args: >-
            image --platform linux/arm64 --quiet --format json --scanners vuln,misconfig,secret,license --list-all-pkgs=false
            --output trivy-image.json ${{ env.IMAGE }}
      - name: Upload to Trivista
        env:
          TRIVISTA_TOKEN: ${{ secrets.TRIVISTA_TOKEN }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            schedule) trigger=schedule ;;
            workflow_dispatch) trigger=manual ;;
            *) trigger=push ;;
          esac
          for report in trivy-source.json trivy-image.json; do
            echo "▶ $report ($(du -h $report | cut -f1), limit 50 MB) → Trivista · $trigger on $GITHUB_REF_NAME @ ${GITHUB_SHA::8}"
            curl --fail-with-body -sS -X POST https://trivista.metawave.ch/api/scans \
              -H "Authorization: Bearer $TRIVISTA_TOKEN" \
              -F report=@$report -F project=trivista -F repo=trivista \
              -F branch=$GITHUB_REF_NAME -F commit=$GITHUB_SHA -F trigger=$trigger
            echo
          done
