<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Users</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2b55c9;text-decoration:none}a:hover{color:#1f429f;text-decoration:underline}
</style>
</helmet>
<div style="width: 100%; min-height: 760px; background: #f6f7f9; color: #15181d; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; line-height: 1.45">

<header style="background: #15181d; color: #ffffff">
<div style="max-width: 1360px; margin: 0 auto; padding: 0 24px; min-height: 52px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 28px">
<a href="Projects.dc.html" style="display: flex; align-items: center; gap: 10px; color: #ffffff; font-weight: 600; font-size: 16px; text-decoration: none"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="6" fill="#2a2f37"></rect><rect x="6" y="7" width="16" height="3" rx="1" fill="#d0362c"></rect><rect x="6" y="12.5" width="12" height="3" rx="1" fill="#e8821e"></rect><rect x="6" y="18" width="7" height="3" rx="1" fill="#f0c94a"></rect></svg>Trivista</a>
<nav aria-label="Main" style="display: flex; gap: 4px; font-size: 14px">
<a href="Projects.dc.html" style="padding: 6px 10px; border-radius: 6px; color: #c3c9d1; text-decoration: none">Projects</a>
<a href="ServiceAccounts.dc.html" style="padding: 6px 10px; border-radius: 6px; color: #c3c9d1; text-decoration: none">Service accounts</a>
<a href="Users.dc.html" aria-current="page" style="padding: 6px 10px; border-radius: 6px; background: #2a2f37; color: #ffffff; text-decoration: none">Users</a>
</nav>
</div>
<div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: #c3c9d1">
<span>[USER NAME]</span>
<button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #4a525e; border-radius: 6px; background: transparent; color: #ffffff; font: 500 13px 'IBM Plex Sans', sans-serif; cursor: pointer">Sign out</button>
</div>
</div>
</header>

<main style="max-width: 1360px; margin: 0 auto; padding: 32px 24px 64px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 32px; line-height: 40px; font-weight: 600; letter-spacing: -0.01em">Users</h1>
<span style="font-size: 13px; color: #4a525e">Signed in via OIDC. Groups come from the identity provider.</span>
</div>

<div style="background: #ffffff; border: 1px solid #d9dde3; border-radius: 6px; overflow-x: auto">
<table style="width: 100%; min-width: 860px; border-collapse: collapse; font-size: 13px">
<thead>
<tr style="background: #f0f2f5; text-align: left; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #4a525e">
<th style="padding: 8px 20px; font-weight: 600; border-bottom: 1px solid #d9dde3">Name</th>
<th style="padding: 8px 12px; font-weight: 600; border-bottom: 1px solid #d9dde3">Groups</th>
<th style="padding: 8px 12px; font-weight: 600; border-bottom: 1px solid #d9dde3">Role</th>
<th style="padding: 8px 12px; font-weight: 600; border-bottom: 1px solid #d9dde3">Status</th>
<th style="padding: 8px 20px 8px 12px; border-bottom: 1px solid #d9dde3"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Actions</span></th>
</tr>
</thead>
<tbody>
<sc-for list="{{users}}" as="u" hint-placeholder-count="5">
<tr style="height: 52px; color: {{u.ink}}">
<td style="padding: 0 20px; border-bottom: 1px solid #e6e9ed; font-weight: 500">{{u.name}}</td>
<td style="padding: 0 12px; border-bottom: 1px solid #e6e9ed">
<span style="display: inline-flex; flex-wrap: wrap; gap: 4px">
<sc-for list="{{u.groups}}" as="g" hint-placeholder-count="2"><span style="padding: 0 6px; border-radius: 3px; background: #f0f2f5; font: 400 12px 'IBM Plex Mono', monospace; color: #4a525e">{{g}}</span></sc-for>
</span>
</td>
<td style="padding: 0 12px; border-bottom: 1px solid #e6e9ed">
<sc-if value="{{u.admin}}" hint-placeholder-val="{{false}}"><span style="padding: 1px 7px; border-radius: 3px; background: #15181d; color: #ffffff; font: 600 11px 'IBM Plex Mono', monospace; letter-spacing: 0.04em">ADMIN</span></sc-if>
<sc-if value="{{u.breakGlass}}" hint-placeholder-val="{{false}}"><span style="margin-left: 4px; padding: 1px 7px; border-radius: 3px; border: 1px solid #15181d; font: 600 11px 'IBM Plex Mono', monospace; letter-spacing: 0.04em">BREAK-GLASS</span></sc-if>
</td>
<td style="padding: 0 12px; border-bottom: 1px solid #e6e9ed"><span style="display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px; border-radius: 3px; border: 1px {{u.lineStyle}} #c3c9d1; font-size: 12px; font-weight: 500"><span style="width: 6px; height: 6px; border-radius: 3px; background: {{u.dot}}"></span>{{u.status}}</span></td>
<td style="padding: 0 20px 0 12px; border-bottom: 1px solid #e6e9ed; text-align: right">
<sc-if value="{{u.canDeactivate}}" hint-placeholder-val="{{true}}"><button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #c3c9d1; border-radius: 6px; background: #ffffff; color: #b42a22; font: 500 13px 'IBM Plex Sans', sans-serif; cursor: pointer">Deactivate</button></sc-if>
<sc-if value="{{u.canReactivate}}" hint-placeholder-val="{{false}}"><button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #c3c9d1; border-radius: 6px; background: #ffffff; color: #15181d; font: 500 13px 'IBM Plex Sans', sans-serif; cursor: pointer">Reactivate</button></sc-if>
</td>
</tr>
</sc-for>
</tbody>
</table>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const u = (name, groups, admin, breakGlass, deactivated) => ({
      name, groups, admin, breakGlass,
      status: deactivated ? 'deactivated' : 'active',
      dot: deactivated ? '#B9C0CA' : '#2B55C9',
      lineStyle: deactivated ? 'dashed' : 'solid',
      ink: deactivated ? '#68717D' : '#15181D',
      canDeactivate: !deactivated && !breakGlass,
      canReactivate: deactivated
    });
    return {
      users: [
        u('[ADMIN NAME]', ['team-platform', 'trivista-admins'], true, false, false),
        u('break-glass', [], true, true, false),
        u('[USER NAME]', ['team-platform'], false, false, false),
        u('[USER NAME]', ['team-sre', 'team-platform'], false, false, false),
        u('[USER NAME]', ['team-billing'], false, false, true)
      ]
    };
  }
}
</script>
</body>
</html>
